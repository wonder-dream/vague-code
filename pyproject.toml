[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "vague-code"
version = "0.1.2"
description = "Lightweight local Coding Agent CLI with agent runtime, tool system, context compression, and eval harness"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "vague-dream" },
]
keywords = ["coding-agent", "cli", "tui", "llm", "agent", "deepseek"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "anthropic>=0.117.0",
    "deepseek-tokenizer>=0.3.0",
    "openai>=2.46.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.1.0",
    "rich>=15.0.0",
    "textual>=8.0.0",
    "tiktoken>=0.8.0",
    "tree-sitter==0.26.0",
    "tree-sitter-python==0.25.0",
]

[project.scripts]
vague-code = "vague_code.cli:main"

[dependency-groups]
dev = [
    "coverage>=7.15.2",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
    "datasets>=3.0.0",  # eval/select_verified_tasks.py（SWE-bench Lite 重选）
]

[tool.mypy]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "vague_code.*"
ignore_errors = false

[[tool.mypy.overrides]]
module = "dotenv.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "deepseek_tokenizer.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests._target_bug.*"
ignore_errors = true

[tool.pytest.ini_options]
norecursedirs = "_target_bug"
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["vague_code*"]

[tool.setuptools.package-data]
"vague_code.tui" = ["*.tcss"]
