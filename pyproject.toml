[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "xcode"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.117.0",
    "openai>=2.46.0",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.mypy]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "src.*"
ignore_errors = false

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]