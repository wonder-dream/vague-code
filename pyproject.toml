[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "xcode"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.117.0",
    "openai>=2.46.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.1.0",
    "rich>=15.0.0",
    "textual>=8.0.0",
    "tiktoken>=0.8.0",
    "tree-sitter==0.26.0",
    "tree-sitter-python==0.25.0",
]

[project.scripts]
xcode = "src.cli:main"

[dependency-groups]
dev = [
    "coverage>=7.15.2",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
]

[tool.mypy]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "src.*"
ignore_errors = false

[[tool.mypy.overrides]]
module = "dotenv.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests._target_bug.*"
ignore_errors = true

[tool.pytest.ini_options]
norecursedirs = "_target_bug"
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
