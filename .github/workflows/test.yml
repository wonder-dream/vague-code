name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check vague_code/ eval/

      - name: Type check (mypy)
        run: uv run mypy vague_code/

      - name: Test (pytest)
        run: uv run pytest tests/ -q --tb=short

      - name: Eval smoke (fake, ADR-0040)
        run: uv run python -m eval.cli --tasks eval/tasks_test.json --fake --fresh --out /tmp/eval_smoke_report.md
